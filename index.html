
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 🧠</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08090d;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth-page{
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.auth-card{
 width:100%;max-width:390px;background:#13151d;
 border:1px solid #292d3a;border-radius:20px;
 padding:28px
}
.logo{text-align:center;font-size:38px;margin-bottom:8px}
.auth-card h1{text-align:center;margin:5px 0}
.subtitle{text-align:center;color:#999;font-size:14px;margin-bottom:25px}
.field{margin:14px 0}
.field label{display:block;color:#bbb;font-size:13px;margin-bottom:7px}
.field input{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid #343846;background:#090b11;color:white;
 outline:none
}
.field input:focus{border-color:#8b72ff}
.primary{
 width:100%;padding:13px;border:0;border-radius:10px;
 background:#8065f5;color:white;font-weight:bold;margin-top:10px
}
.secondary{
 width:100%;padding:11px;border:1px solid #343846;
 border-radius:10px;background:#20232d;color:white;margin-top:9px
}
.auth-links{
 display:flex;justify-content:space-between;gap:8px;
 margin-top:17px;flex-wrap:wrap
}
.link{
 background:none;border:0;color:#a997ff;
 font-size:13px;text-decoration:underline
}
#authMessage{font-size:13px;color:#c3b7ff;margin-top:14px;line-height:1.5}

.app{height:100vh;display:flex;flex-direction:column}
header{
 height:65px;flex-shrink:0;border-bottom:1px solid #252833;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 18px;background:#101219
}
.brand{font-size:21px;font-weight:bold}
.header-actions{display:flex;align-items:center;gap:9px}
.small-btn{
 background:#20232d;border:1px solid #343846;color:white;
 border-radius:9px;padding:9px 11px;font-size:12px
}
#userEmail{font-size:12px;color:#aaa;max-width:140px;overflow:hidden;text-overflow:ellipsis}
main{
 flex:1;overflow-y:auto;width:100%;max-width:850px;
 margin:auto;padding:22px 16px
}
.welcome{text-align:center;margin:45px 0 25px}
.welcome .big{font-size:48px}
.welcome h2{margin:10px 0}
.welcome p{color:#999;font-size:14px}
#messages{display:flex;flex-direction:column;gap:15px}
.message{
 max-width:85%;padding:13px 16px;border-radius:15px;
 line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere
}
.user{align-self:flex-end;background:#6952d9}
.assistant{align-self:flex-start;background:#191c26;border:1px solid #292d3a}
.message-label{font-size:10px;color:#aaa;margin-bottom:5px}
.composer{
 width:100%;max-width:850px;margin:auto;padding:12px 16px 18px
}
.composer-inner{
 display:flex;gap:9px;background:#171a23;
 border:1px solid #343846;border-radius:15px;padding:9px
}
#messageInput{
 flex:1;resize:none;min-height:42px;max-height:140px;
 background:transparent;border:0;color:white;outline:none;padding:10px
}
#sendButton{
 width:45px;border:0;border-radius:10px;
 background:#8065f5;color:white;font-size:20px
}
.status{text-align:center;color:#777;font-size:11px;padding-bottom:8px}
.panel{
 max-width:850px;margin:20px auto;padding:18px;
 background:#151821;border:1px solid #303441;border-radius:14px
}
.panel h3{margin-top:0}
.panel input{
 width:100%;padding:12px;margin:7px 0 12px;
 background:#090b11;border:1px solid #343846;
 border-radius:9px;color:white
}
.panel button{margin:5px 5px 5px 0}
.danger{background:#632d38!important}
</style>
</head>

<body>

<!-- CONNEXION / INSCRIPTION -->
<section id="authPage" class="auth-page">
 <div class="auth-card">
  <div class="logo">🧠</div>
  <h1>Nova</h1>
  <div class="subtitle">Ton assistant personnel intelligent</div>

  <div id="loginForm">
   <div class="field">
    <label>Adresse e-mail</label>
    <input id="loginEmail" type="email" placeholder="ton@email.com" autocomplete="email">
   </div>
   <div class="field">
    <label>Mot de passe</label>
    <input id="loginPassword" type="password" placeholder="Ton mot de passe" autocomplete="current-password">
   </div>
   <button class="primary" id="loginButton">Se connecter</button>
   <div class="auth-links">
    <button class="link" id="showSignup">Créer un compte</button>
    <button class="link" id="showReset">Mot de passe oublié ?</button>
   </div>
  </div>

  <div id="signupForm" class="hidden">
   <div class="field">
    <label>Adresse e-mail</label>
    <input id="signupEmail" type="email" placeholder="ton@email.com" autocomplete="email">
   </div>
   <div class="field">
    <label>Mot de passe (6 caractères minimum)</label>
    <input id="signupPassword" type="password" placeholder="Choisis un mot de passe" autocomplete="new-password">
   </div>
   <button class="primary" id="signupButton">Créer mon compte</button>
   <button class="secondary" id="backLogin1">Retour à la connexion</button>
  </div>

  <div id="resetForm" class="hidden">
   <div class="field">
    <label>Ton adresse e-mail</label>
    <input id="resetEmail" type="email" placeholder="ton@email.com">
   </div>
   <button class="primary" id="resetButton">Envoyer le lien</button>
   <button class="secondary" id="backLogin2">Retour à la connexion</button>
  </div>

  <div id="authMessage"></div>
 </div>
</section>

<!-- APPLICATION -->
<section id="appPage" class="app hidden">
 <header>
  <div class="brand">🧠 Nova</div>
  <div class="header-actions">
   <span id="userEmail"></span>
   <button class="small-btn" id="settingsButton">⚙️</button>
   <button class="small-btn" id="logoutButton">Déconnexion</button>
  </div>
 </header>

 <main>
  <div id="welcome" class="welcome">
   <div class="big">🧠</div>
   <h2>Bonjour, bienvenue sur Nova !</h2>
   <p>Je suis ton assistant personnel. Que veux-tu faire aujourd'hui ?</p>
  </div>
  <div id="messages"></div>

  <div id="settingsPanel" class="panel hidden">
   <h3>⚙️ Réglages de Nova</h3>
   <label>Adresse du serveur IA</label>
   <input id="serverInput" placeholder="https://api.groq.com/openai/v1">
   <label>Nom du modèle</label>
   <input id="modelInput" placeholder="openai/gpt-oss-20b">
   <label>Clé API Groq</label>
   <input id="keyInput" type="password" placeholder="gsk_...">
   <button class="small-btn" id="saveSettings">Enregistrer</button>
   <button class="small-btn" id="closeSettings">Fermer</button>
   <hr style="border-color:#343846;margin:18px 0">
   <button class="small-btn danger" id="clearHistory">Effacer mes conversations</button>
   <p style="color:#999;font-size:12px">
    Tes réglages IA sont enregistrés dans ce navigateur.
   </p>
  </div>
 </main>

 <div class="composer">
  <div class="status" id="status">Nova est prête ❤️</div>
  <div class="composer-inner">
   <textarea id="messageInput" placeholder="Écris un message à Nova..." rows="1"></textarea>
   <button id="sendButton">➤</button>
  </div>
 </div>
</section>

<script>
const SUPABASE_URL = "https://yvkldxqrgnigxesoxycc.supabase.co";
const SUPABASE_KEY = "sb_publishable_DwDUh-Le_xR6mJnojXdL5w_QI-00AZT";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let facts = [];
let conversation = [];
let sending = false;

const $ = id => document.getElementById(id);

function showMessage(id, message) {
 $(id).textContent = message;
}

function showAuthForm(form) {
 ["loginForm","signupForm","resetForm"].forEach(id =>
  $(id).classList.toggle("hidden", id !== form)
 );
 showMessage("authMessage","");
}

function showApp() {
 $("authPage").classList.add("hidden");
 $("appPage").classList.remove("hidden");
 $("userEmail").textContent = currentUser.email || "";
}

function showAuth() {
 $("appPage").classList.add("hidden");
 $("authPage").classList.remove("hidden");
}

function normalizeText(value) {
 return String(value || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g,"")
  .toLowerCase().trim();
}

/* AUTHENTIFICATION */

$("showSignup").onclick = () => showAuthForm("signupForm");
$("showReset").onclick = () => showAuthForm("resetForm");
$("backLogin1").onclick = () => showAuthForm("loginForm");
$("backLogin2").onclick = () => showAuthForm("loginForm");

$("signupButton").onclick = async () => {
 const email = $("signupEmail").value.trim();
 const password = $("signupPassword").value;

 if (!email || password.length < 6) {
  return showMessage("authMessage","Entre un e-mail valide et un mot de passe d'au moins 6 caractères.");
 }

 $("signupButton").disabled = true;
 showMessage("authMessage","Création du compte...");

 const {data,error} = await db.auth.signUp({
  email,password
 });

 $("signupButton").disabled = false;

 if (error) return showMessage("authMessage",error.message);

 if (data.session) {
  showMessage("authMessage","Compte créé !");
 } else {
  showMessage("authMessage","Compte créé ! Vérifie ta boîte mail pour confirmer ton adresse avant de te connecter.");
  showAuthForm("loginForm");
  showMessage("authMessage","Compte créé ! Consulte tes e-mails pour confirmer ton inscription.");
 }
};

$("loginButton").onclick = async () => {
 const email = $("loginEmail").value.trim();
 const password = $("loginPassword").value;

 if (!email || !password) {
  return showMessage("authMessage","Entre ton e-mail et ton mot de passe.");
 }

 $("loginButton").disabled = true;
 showMessage("authMessage","Connexion...");

 const {error} = await db.auth.signInWithPassword({email,password});

 $("loginButton").disabled = false;

 if (error) showMessage("authMessage",error.message);
};

$("resetButton").onclick = async () => {
 const email = $("resetEmail").value.trim();
 if (!email) return showMessage("authMessage","Entre ton adresse e-mail.");

 const {error} = await db.auth.resetPasswordForEmail(email,{
  redirectTo: window.location.origin + window.location.pathname
 });

 if (error) return showMessage("authMessage",error.message);

 showMessage("authMessage","Si cette adresse possède un compte, un e-mail de réinitialisation va être envoyé.");
};

$("logoutButton").onclick = async () => {
 await db.auth.signOut();
};

db.auth.onAuthStateChange(async (event,session) => {
 if (event === "PASSWORD_RECOVERY") {
  const newPassword = prompt("Entre ton nouveau mot de passe (6 caractères minimum) :");
  if (newPassword && newPassword.length >= 6) {
   const {error} = await db.auth.updateUser({password:newPassword});
   alert(error ? error.message : "Mot de passe modifié !");
  }
 }

 if (session?.user) {
  currentUser = session.user;
  showApp();
  await loadUserData();
 } else {
  currentUser = null;
  facts = [];
  conversation = [];
  $("messages").innerHTML = "";
  showAuth();
 }
});

/* MEMOIRE PERSONNELLE */

async function loadFacts() {
 facts = [];

 if (!currentUser) return;

 const {data,error} = await db.from("nova_facts")
  .select("id,content,created_at")
  .eq("user_id",currentUser.id)
  .order("created_at",{ascending:false})
  .limit(50);

 if (error) {
  console.error("Erreur chargement mémoire :",error);
  return;
 }

 facts = data || [];
}

async function saveFact(content) {
 if (!currentUser || !content.trim()) return false;

 const exists = facts.some(f => normalizeText(f.content) === normalizeText(content));
 if (exists) return true;

 const {data,error} = await db.from("nova_facts")
  .insert({user_id:currentUser.id,content:content.trim()})
  .select("id,content,created_at")
  .single();

 if (error) {
  console.error(error);
  return false;
 }

 facts.unshift(data);
 return true;
}

async function forgetFact(keyword) {
 if (!currentUser) return false;

 const word = normalizeText(keyword);
 const matches = facts.filter(f => normalizeText(f.content).includes(word));

 if (!matches.length) return false;

 const ids = matches.map(f => f.id);
 const {error} = await db.from("nova_facts")
  .delete()
  .eq("user_id",currentUser.id)
  .in("id",ids);

 if (error) {
  console.error(error);
  return false;
 }

 facts = facts.filter(f => !ids.includes(f.id));
 return true;
}

async function forgetAllFacts() {
 if (!currentUser) return false;

 const {error} = await db.from("nova_facts")
  .delete()
  .eq("user_id",currentUser.id);

 if (error) return false;

 facts = [];
 return true;
}

async function handleMemoryCommand(text) {
 const t = normalizeText(text);

 if (/^(oublie|efface|supprime) (tous mes souvenirs|toute ma memoire|tout ce que tu sais sur moi)[.! ]*$/.test(t)) {
  const ok = await forgetAllFacts();
  return ok ? "J'ai effacé tes souvenirs personnels. ❤️" : "Je n'ai pas réussi à effacer tes souvenirs.";
 }

 const saveMatch = text.match(/^(souviens-toi que|retiens que|memorise que)\s+(.+)[.! ]*$/i);
 if (saveMatch) {
  const ok = await saveFact(saveMatch[2].replace(/[.! ]+$/,""));
  return ok ? "C'est enregistré dans ta mémoire ! 🧠❤️" : "Je n'ai pas réussi à enregistrer ce souvenir.";
 }

 const forgetMatch = text.match(/^(oublie|efface|supprime)\s+(.+?)[.! ]*$/i);
 if (forgetMatch) {
  const keyword = forgetMatch[2].replace(/[.! ]+$/,"");
  const ok = await forgetFact(keyword);
  return ok ? "C'est oublié ! ❤️" : "Je n'ai trouvé aucun souvenir correspondant.";
 }

 return null;
}

async function suggestMemory(text) {
 const patterns = [
  /j'aime .+/i,/j'adore .+/i,/je prefere .+/i,
  /je deteste .+/i,/mon animal prefere est .+/i,
  /ma couleur preferee est .+/i,/mon plat prefere est .+/i
 ];

 if (!patterns.some(p => p.test(normalizeText(text)))) return;

 if (confirm("Veux-tu que Nova retienne cette information pour les prochaines conversations ?")) {
  const ok = await saveFact(text);
  if (ok) addMessage("assistant","Je garderai cette information en mémoire ! 🧠❤️");
 }
}

/* CONVERSATIONS PRIVEES */

async function loadConversation() {
 conversation = [];

 const {data,error} = await db.from("nova_memories")
  .select("id,content,category,created_at")
  .eq("user_id",currentUser.id)
  .eq("category","conversation")
  .order("created_at",{ascending:true})
  .limit(100);

 if (error) {
  console.error("Erreur historique :",error);
  return;
 }

 for (const row of (data || [])) {
  try {
   const item = JSON.parse(row.content);
   if (item.role && item.content) conversation.push(item);
  } catch(e) {}
 }

 conversation = conversation.slice(-40);
 renderConversation();
}

async function saveConversationMessage(role,content) {
 if (!currentUser) return;

 const {error} = await db.from("nova_memories").insert({
  user_id:currentUser.id,
  content:JSON.stringify({role,content}),
  category:"conversation"
 });

 if (error) console.error("Erreur sauvegarde conversation :",error);
}

async function loadUserData() {
 $("messages").innerHTML = "";
 conversation = [];
 facts = [];
 $("welcome").classList.remove("hidden");

 await loadFacts();
 await loadConversation();
}

async function clearHistory() {
 if (!confirm("Effacer toutes tes conversations ? Tes souvenirs personnels seront conservés.")) return;

 const {error} = await db.from("nova_memories")
  .delete()
  .eq("user_id",currentUser.id)
  .eq("category","conversation");

 if (error) {
  alert("Impossible d'effacer l'historique : " + error.message);
  return;
 }

 conversation = [];
 $("messages").innerHTML = "";
 $("welcome").classList.remove("hidden");
}

/* AFFICHAGE */

function addMessage(role,content) {
 $("welcome").classList.add("hidden");

 const div = document.createElement("div");
 div.className = "message " + (role === "user" ? "user" : "assistant");

 const label = document.createElement("div");
 label.className = "message-label";
 label.textContent = role === "user" ? "Toi" : "Nova";

 const body = document.createElement("div");
 body.textContent = content;

 div.append(label,body);
 $("messages").appendChild(div);
 $("messages").scrollTop = $("messages").scrollHeight;
 window.scrollTo(0,document.body.scrollHeight);
}

/* IA GROQ */

function getSettings() {
 try {
  return JSON.parse(localStorage.getItem("nova_settings")) || {};
 } catch(e) {
  return {};
 }
}

async function askNova() {
 const settings = getSettings();

 const server = (settings.server || "https://api.groq.com/openai/v1").replace(/\/+$/,"");
 const model = settings.model || "openai/gpt-oss-20b";
 const key = settings.key || "";

 if (!key) throw new Error("Ajoute ta clé API Groq dans les réglages ⚙️.");

 const memoryText = facts.map(f => "- " + f.content).join("\n");

 const systemPrompt = `Tu es Nova, une assistante intelligente, chaleureuse et utile.
Tu réponds en français sauf demande contraire.
Tu es honnête : ne prétends jamais avoir fait une action que tu n'as pas faite.
Tu connais uniquement les souvenirs personnels présents ci-dessous.
Souvenirs personnels de cet utilisateur :
${memoryText || "Aucun souvenir enregistré."}
Ne révèle jamais les informations d'un autre utilisateur.`;

 const messages = [
  {role:"system",content:systemPrompt},
  ...conversation.slice(-20).map(m => ({role:m.role,content:m.content}))
 ];

 const response = await fetch(server + "/chat/completions",{
  method:"POST",
  headers:{
   "Content-Type":"application/json",
   "Authorization":"Bearer " + key
  },
  body:JSON.stringify({
   model,
   messages,
   temperature:0.7
  })
 });

 if (!response.ok) {
  const detail = await response.text();
  throw new Error("Erreur IA (" + response.status + ") : " + detail.slice(0,250));
 }

 const data = await response.json();
 return data.choices?.[0]?.message?.content || "Je n'ai pas réussi à répondre.";
}

/* ENVOI DES MESSAGES */

async function sendMessage() {
 if (sending || !currentUser) return;

 const text = $("messageInput").value.trim();
 if (!text) return;

 $("messageInput").value = "";
 sending = true;
 $("sendButton").disabled = true;
 $("status").textContent = "Nova réfléchit...";

 addMessage("user",text);

 const commandAnswer = await handleMemoryCommand(text);

 if (commandAnswer !== null) {
  addMessage("assistant",commandAnswer);
  await saveConversationMessage("user",text);
  await saveConversationMessage("assistant",commandAnswer);
  conversation.push({role:"user",content:text},{role:"assistant",content:commandAnswer});
 } else {
  await suggestMemory(text);

  conversation.push({role:"user",content:text});
  await saveConversationMessage("user",text);

  try {
   const answer = await askNova();
   addMessage("assistant",answer);
   conversation.push({role:"assistant",content:answer});
   await saveConversationMessage("assistant",answer);
  } catch(error) {
   addMessage("assistant","Oups ! " + error.message);
   conversation.pop();
  }
 }

 $("status").textContent = "Nova est prête ❤️";
 $("sendButton").disabled = false;
 sending = false;
 $("messageInput").focus();
}

$("sendButton").onclick = sendMessage;

$("messageInput").addEventListener("keydown",e => {
 if (e.key === "Enter" && !e.shiftKey) {
  e.preventDefault();
  sendMessage();
 }
});

/* REGLAGES */

$("settingsButton").onclick = () => {
 const s = getSettings();
 $("serverInput").value = s.server || "https://api.groq.com/openai/v1";
 $("modelInput").value = s.model || "openai/gpt-oss-20b";
 $("keyInput").value = s.key || "";
 $("settingsPanel").classList.remove("hidden");
};

$("closeSettings").onclick = () => $("settingsPanel").classList.add("hidden");

$("saveSettings").onclick = () => {
 localStorage.setItem("nova_settings",JSON.stringify({
  server:$("serverInput").value.trim(),
  model:$("modelInput").value.trim(),
  key:$("keyInput").value.trim()
 }));
 alert("Réglages enregistrés !");
 $("settingsPanel").classList.add("hidden");
};

$("clearHistory").onclick = clearHistory;

/* DEMARRAGE */

(async function init() {
 const {data,error} = await db.auth.getSession();

 if (error) {
  showMessage("authMessage","Erreur de connexion à Supabase : " + error.message);
 }

 if (data?.session?.user) {
  currentUser = data.session.user;
  showApp();
  await loadUserData();
 } else {
  showAuth();
 }
})();
</script>
</body>
</html>
