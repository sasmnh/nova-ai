
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Nova 🧠</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #08090d;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.app {
  height: 100dvh;
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 25px 20px 15px;
  border-bottom: 1px solid #24252b;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  color: #8e8e93;
  margin-top: 5px;
  font-size: 13px;
}

button {
  border: none;
  color: white;
  background: #315efb;
  padding: 12px 16px;
  border-radius: 15px;
  cursor: pointer;
}

#clearMemory {
  background: #202127;
}

#status {
  padding: 12px 20px;
  color: #a0a0aa;
  font-size: 13px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 20px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.nova {
  background: #202127;
  align-self: flex-start;
}

.user {
  background: #315efb;
  align-self: flex-end;
}

.input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  padding-bottom: max(15px, env(safe-area-inset-bottom));
  border-top: 1px solid #24252b;
}

input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: #1b1c21;
  color: white;
  padding: 15px;
  border-radius: 22px;
  font-size: 16px;
}

#send {
  width: 48px;
  height: 48px;
  padding: 0;
  font-size: 22px;
  border-radius: 50%;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#settingsPanel {
  display: none;
  padding: 15px;
  background: #171920;
  border-bottom: 1px solid #292c36;
}

#settingsPanel.open {
  display: block;
}

#settingsPanel input {
  width: 100%;
  margin: 5px 0 12px;
  border-radius: 12px;
}

small {
  color: #a0a0aa;
}

@media(max-width: 480px) {
  .message {
    max-width: 92%;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>Nova 🧠</h1>
    <div class="subtitle">Ton assistante personnelle</div>
  </div>

  <div>
    <button id="settingsButton">⚙️</button>
    <button id="clearMemory">🗑️</button>
  </div>
</header>

<div id="settingsPanel">
  <small>Adresse du serveur IA compatible OpenAI</small>
  <input
    id="server"
    placeholder="https://ton-serveur.example/v1"
  >

  <small>Nom du modèle</small>
  <input
    id="model"
    placeholder="Nom du modèle"
  >

  <small>Clé API (facultative)</small>
  <input
    id="apiKey"
    type="password"
    placeholder="Clé API"
  >

  <button id="saveSettings">Enregistrer</button>
</div>

<div id="status">
  🟢 Nova est prête à discuter.
</div>

<main id="messages" aria-live="polite"></main>

<form class="input-area" id="chatForm">

  <input
    id="input"
    type="text"
    placeholder="Écris à Nova..."
    autocomplete="off"
  >

  <button id="send" type="submit">
    ↑
  </button>

</form>

</div>

<script>

(() => {

const $ = id => document.getElementById(id);

const MEMORY_KEY = "nova_memory";
const SETTINGS_KEY = "nova_settings";

const PERSONA =
"Tu es Nova, une IA drôle, chaleureuse, spontanée et pleine de personnalité. Tu parles principalement français, avec des expressions familières inspirées du français gabonais quand cela convient. Tu es intelligente, respectueuse, honnête et utile. Tu ne prétends jamais avoir effectué une action que tu n'as pas faite.";

let conversation = [];
let busy = false;

let settings = {
  server: "",
  model: "",
  apiKey: ""
};

try {
  conversation = JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

  if (!Array.isArray(conversation)) {
    conversation = [];
  }

  settings = {
    ...settings,
    ...JSON.parse(
      localStorage.getItem(SETTINGS_KEY) || "{}"
    )
  };

} catch (error) {
  console.error(error);
  conversation = [];
}

const messages = $("messages");
const input = $("input");
const send = $("send");
const status = $("status");

$("server").value = settings.server;
$("model").value = settings.model;
$("apiKey").value = settings.apiKey;

function saveMemory() {
  try {
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(conversation.slice(-40))
    );
  } catch (error) {
    status.textContent = "⚠️ Impossible de sauvegarder la mémoire.";
  }
}

function addMessage(text, role) {

  const element = document.createElement("div");

  element.className =
    "message " + (role === "user" ? "user" : "nova");

  element.textContent = text;

  messages.appendChild(element);

  messages.scrollTop = messages.scrollHeight;

  return element;
}

function restoreMessages() {

  messages.replaceChildren();

  if (!conversation.length) {
    addMessage(
      "Salut ! Moi, c'est Nova 🧠✨ Tu peux m'écrire, je suis là !",
      "assistant"
    );
    return;
  }

  conversation.forEach(message => {
    if (
      message.role === "user" ||
      message.role === "assistant"
    ) {
      addMessage(message.content, message.role);
    }
  });
}

function setBusy(value) {
  busy = value;
  send.disabled = value;
  input.disabled = false;
}

async function askNova(text) {

  if (!settings.server) {
    return "Je suis bien là ! ❤️ Mais mon cerveau IA n'est pas encore connecté. Ouvre les réglages ⚙️ pour connecter mon serveur.";
  }

  const endpoint =
    settings.server.trim().replace(/\/+$/, "");

  const headers = {
    "Content-Type": "application/json"
  };

  if (settings.apiKey) {
    headers.Authorization =
      "Bearer " + settings.apiKey;
  }

  const response = await fetch(
    endpoint + "/chat/completions",
    {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: settings.model || "default",
        messages: [
          {
            role: "system",
            content: PERSONA
          },
          ...conversation.slice(-20)
        ],
        temperature: 0.8,
        max_tokens: 500,
        stream: false
      })
    }
  );

  if (!response.ok) {
    throw new Error("Erreur serveur HTTP " + response.status);
  }

  const data = await response.json();

  const answer =
    data.choices?.[0]?.message?.content;

  if (!answer) {
    throw new Error("Réponse vide du serveur");
  }

  return answer;
}

async function sendMessage(event) {

  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";

  addMessage(text, "user");

  conversation.push({
    role: "user",
    content: text
  });

  conversation = conversation.slice(-40);

  saveMemory();

  setBusy(true);

  const thinking = addMessage(
    "💭 Nova réfléchit...",
    "assistant"
  );

  try {

    const answer = await askNova(text);

    thinking.textContent = answer;

    conversation.push({
      role: "assistant",
      content: answer
    });

    conversation = conversation.slice(-40);

    saveMemory();

    status.textContent =
      settings.server
        ? "🟢 Nova a répondu."
        : "🟡 Mode sans serveur IA.";

  } catch (error) {

    console.error(error);

    thinking.textContent =
      "Oups ! Je n'arrive pas à joindre mon cerveau. Vérifie la connexion au serveur dans les réglages. (" +
      error.message + ")";

    status.textContent =
      "🔴 Connexion au serveur impossible.";

    conversation.pop();

    saveMemory();

  } finally {

    setBusy(false);

    input.focus();

    messages.scrollTop = messages.scrollHeight;

  }
}

$("chatForm").addEventListener(
  "submit",
  sendMessage
);

$("settingsButton").addEventListener(
  "click",
  () => {
    $("settingsPanel").classList.toggle("open");
  }
);

$("saveSettings").addEventListener(
  "click",
  () => {

    settings.server = $("server").value.trim();
    settings.model = $("model").value.trim();
    settings.apiKey = $("apiKey").value;

    localStorage.setItem(
      SETTINGS_KEY,
      JSON.stringify(settings)
    );

    $("settingsPanel").classList.remove("open");

    status.textContent =
      "⚙️ Configuration enregistrée. Le serveur sera contacté au prochain message.";

    input.focus();
  }
);

$("clearMemory").addEventListener(
  "click",
  () => {

    if (!confirm("Effacer toute la mémoire de Nova ?")) {
      return;
    }

    conversation = [];

    localStorage.removeItem(MEMORY_KEY);

    restoreMessages();

    status.textContent = "🧠 Mémoire effacée.";

  }
);

restoreMessages();

input.disabled = false;
send.disabled = false;

input.focus();

})();

</script>

</body>
</html>
