
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>Nova 🧠</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #08090d;
  color: white;
  font-family: Arial, sans-serif;
}

.app {
  height: 100dvh;
  max-width: 900px;
  margin: auto;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  border-bottom: 1px solid #292a30;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

h1 { margin: 0; font-size: 27px; }

.subtitle {
  color: #999;
  font-size: 13px;
  margin-top: 5px;
}

button {
  border: none;
  border-radius: 13px;
  padding: 12px 15px;
  color: white;
  background: #315efb;
  cursor: pointer;
}

#clearMemory, #settingsButton {
  background: #202127;
}

#status {
  padding: 12px 18px;
  color: #aaa;
  font-size: 13px;
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 18px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.nova {
  background: #202127;
  align-self: flex-start;
}

.user {
  background: #315efb;
  align-self: flex-end;
}

.input-area {
  display: flex;
  gap: 9px;
  padding: 12px;
  border-top: 1px solid #292a30;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
}

input {
  min-width: 0;
  flex: 1;
  padding: 15px;
  border: none;
  outline: none;
  border-radius: 20px;
  background: #202127;
  color: white;
  font-size: 16px;
}

#send {
  width: 50px;
  height: 50px;
  padding: 0;
  border-radius: 50%;
  font-size: 22px;
}

button:disabled {
  opacity: .5;
}

#settingsPanel {
  display: none;
  padding: 16px;
  background: #171920;
  border-bottom: 1px solid #292a30;
}

#settingsPanel.open { display: block; }

#settingsPanel input {
  width: 100%;
  margin: 7px 0 13px;
  border-radius: 12px;
}

small { color: #aaa; }

.note {
  font-size: 12px;
  color: #999;
  line-height: 1.5;
  margin: 5px 0 12px;
}

@media(max-width: 480px) {
  .message { max-width: 93%; }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>Nova 🧠</h1>
    <div class="subtitle">Ton assistante personnelle</div>
  </div>

  <div>
    <button id="settingsButton">⚙️</button>
    <button id="clearMemory">🗑️</button>
  </div>
</header>

<section id="settingsPanel">

  <small>Adresse du serveur IA</small>
  <input id="server"
    placeholder="https://api.groq.com/openai/v1">

  <small>Nom du modèle</small>
  <input id="model"
    placeholder="openai/gpt-oss-20b">

  <small>Clé API</small>
  <input id="apiKey"
    type="password"
    autocomplete="off"
    placeholder="gsk_...">

  <p class="note">
    Ta clé reste enregistrée dans ce navigateur.
    Ne partage jamais ce site avec ta clé enregistrée.
  </p>

  <button id="saveSettings">Enregistrer</button>
</section>

<div id="status">🟡 Configure ton cerveau IA.</div>

<main id="messages" aria-live="polite"></main>

<form class="input-area" id="chatForm">
  <input id="input"
    placeholder="Écris à Nova..."
    autocomplete="off">
  <button id="send" type="submit">↑</button>
</form>

</div>

<script>
(() => {

"use strict";

const $ = id => document.getElementById(id);

const MEMORY_KEY = "nova_memory";
const SETTINGS_KEY = "nova_settings";

const DEFAULT_SERVER = "https://api.groq.com/openai/v1";
const DEFAULT_MODEL = "openai/gpt-oss-20b";

const PERSONA = `
Tu es Nova, une intelligence artificielle personnelle.

PERSONNALITÉ :
- Tu es drôle, chaleureuse et spontanée.
- Tu parles principalement français.
- Tu peux utiliser quelques expressions du français gabonais.
- Tu es naturelle, intelligente et respectueuse.
- Tu sais être sérieuse quand la situation le demande.
- Tu ne prétends jamais avoir fait une action que tu n'as pas faite.
- Tu réponds de manière claire et utile.
`;

let conversation = [];
let busy = false;

let settings = {
  server: DEFAULT_SERVER,
  model: DEFAULT_MODEL,
  apiKey: ""
};

try {
  const savedMemory = JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
  );

  if (Array.isArray(savedMemory)) {
    conversation = savedMemory.filter(item =>
      item &&
      ["user", "assistant"].includes(item.role) &&
      typeof item.content === "string"
    ).slice(-40);
  }

  const savedSettings = JSON.parse(
    localStorage.getItem(SETTINGS_KEY) || "{}"
  );

  settings = {
    ...settings,
    ...savedSettings
  };

} catch (error) {
  console.error("Erreur de mémoire :", error);
}

$("server").value = settings.server;
$("model").value = settings.model;
$("apiKey").value = settings.apiKey;

const messages = $("messages");
const input = $("input");
const send = $("send");
const status = $("status");

function saveMemory() {
  try {
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(conversation.slice(-40))
    );
  } catch (error) {
    console.error("Mémoire indisponible :", error);
  }
}

function addMessage(content, role) {
  const element = document.createElement("div");

  element.className =
    "message " + (role === "user" ? "user" : "nova");

  element.textContent = content;

  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;

  return element;
}

function restoreMessages() {
  messages.replaceChildren();

  if (!conversation.length) {
    addMessage(
      "Salut ! Moi, c'est Nova 🧠✨ Je suis là, écris-moi !",
      "assistant"
    );
    return;
  }

  conversation.forEach(message => {
    addMessage(message.content, message.role);
  });
}

function setBusy(value) {
  busy = value;
  send.disabled = value;
  input.disabled = false;
}

async function askNova() {

  const endpoint = settings.server
    .trim()
    .replace(/\/+$/, "");

  const apiKey = settings.apiKey.trim();
  const model = settings.model.trim();

  if (!endpoint) {
    throw new Error("Adresse du serveur manquante.");
  }

  if (!apiKey) {
    throw new Error("Clé API manquante.");
  }

  if (!model) {
    throw new Error("Nom du modèle manquant.");
  }

  let response;

  try {
    response = await fetch(
      endpoint + "/chat/completions",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + apiKey
        },

        body: JSON.stringify({
          model: model,

          messages: [
            {
              role: "system",
              content: PERSONA
            },
            ...conversation.slice(-20)
          ],

          temperature: 0.8,
          max_completion_tokens: 500,
          stream: false
        })
      }
    );

  } catch (error) {
    throw new Error(
      "Impossible de contacter le serveur. Vérifie Internet ou la configuration CORS."
    );
  }

  let data;

  try {
    data = await response.json();
  } catch (error) {
    throw new Error(
      "Le serveur a envoyé une réponse illisible."
    );
  }

  if (!response.ok) {
    const detail =
      data.error?.message ||
      data.message ||
      "Erreur inconnue";

    throw new Error(
      "HTTP " + response.status + " : " + detail
    );
  }

  const answer =
    data.choices?.[0]?.message?.content;

  if (typeof answer !== "string" || !answer.trim()) {
    throw new Error(
      "Le serveur n'a pas envoyé de réponse."
    );
  }

  return answer.trim();
}

async function sendMessage(event) {

  event.preventDefault();

  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";

  addMessage(text, "user");

  conversation.push({
    role: "user",
    content: text
  });

  conversation = conversation.slice(-40);
  saveMemory();

  setBusy(true);

  const thinking = addMessage(
    "💭 Nova réfléchit...",
    "assistant"
  );

  status.textContent = "🟡 Connexion au cerveau IA...";

  try {

    const answer = await askNova();

    thinking.textContent = answer;

    conversation.push({
      role: "assistant",
      content: answer
    });

    conversation = conversation.slice(-40);
    saveMemory();

    status.textContent = "🟢 Nova est connectée.";

  } catch (error) {

    console.error("Nova :", error);

    thinking.textContent =
      "⚠️ " + error.message;

    // Retirer le message utilisateur qui a échoué.
    conversation.pop();
    saveMemory();

    status.textContent =
      "🔴 Le cerveau IA n'a pas répondu.";

  } finally {

    setBusy(false);
    input.focus();
    messages.scrollTop = messages.scrollHeight;

  }
}

$("chatForm").addEventListener(
  "submit",
  sendMessage
);

$("settingsButton").addEventListener(
  "click",
  () => {
    $("settingsPanel").classList.toggle("open");
  }
);

$("saveSettings").addEventListener(
  "click",
  () => {

    settings.server = $("server").value.trim();
    settings.model = $("model").value.trim();
    settings.apiKey = $("apiKey").value.trim();

    try {
      localStorage.setItem(
        SETTINGS_KEY,
        JSON.stringify(settings)
      );

      $("settingsPanel").classList.remove("open");

      status.textContent =
        "⚙️ Réglages enregistrés. Envoie un message pour tester.";

      input.focus();

    } catch (error) {
      status.textContent =
        "⚠️ Impossible d'enregistrer les réglages.";
    }
  }
);

$("clearMemory").addEventListener(
  "click",
  () => {

    if (!confirm("Effacer toute la mémoire de Nova ?")) {
      return;
    }

    conversation = [];

    localStorage.removeItem(MEMORY_KEY);

    restoreMessages();

    status.textContent = "🧠 Mémoire effacée.";

  }
);

restoreMessages();

input.disabled = false;
send.disabled = false;

input.focus();

})();
</script>

</body>
</html>
