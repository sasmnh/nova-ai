<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 🧠</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090d;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

header {
    padding: 55px 20px 15px;
    border-bottom: 1px solid #24252b;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 30px;
}

.subtitle {
    color: #8e8e93;
    margin-top: 5px;
}

#clearMemory {
    background: #202127;
    color: white;
    border: none;
    border-radius: 15px;
    padding: 8px 12px;
    font-size: 12px;
}

#status {
    padding: 10px 20px;
    color: #8e8e93;
    font-size: 13px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    max-width: 85%;
    padding: 13px 16px;
    margin-bottom: 12px;
    border-radius: 20px;
    line-height: 1.4;
    white-space: pre-wrap;
}

.nova {
    background: #202127;
}

.user {
    background: #315efb;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    padding-bottom: 25px;
    border-top: 1px solid #24252b;
}

input {
    flex: 1;
    border: none;
    outline: none;
    background: #1b1c21;
    color: white;
    padding: 15px;
    border-radius: 22px;
    font-size: 16px;
}

button {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #315efb;
    color: white;
    font-size: 20px;
}

#clearMemory {
    width: auto;
    height: auto;
}
</style>
</head>

<body>

<div class="app">

<header>

    <div>
        <h1>Nova 🧠</h1>
        <div class="subtitle">Ton assistant personnel</div>
    </div>

    <button id="clearMemory">
        🗑️
    </button>

</header>

<div id="status">
    ⏳ Préparation de Nova...
</div>

<main id="messages"></main>

<div class="input-area">

    <input
        id="input"
        type="text"
        placeholder="Écris à Nova..."
        disabled
    >

    <button id="send" disabled>
        ↑
    </button>

</div>

</div>


<script type="module">

import * as webllm from
"https://esm.run/@mlc-ai/web-llm";


/* =========================
   MODÈLE
========================= */

const MODEL =
"Llama-3.2-1B-Instruct-q4f16_1-MLC";

let engine = null;


/* =========================
   MÉMOIRE
========================= */

const MEMORY_KEY =
"nova_memory";

let conversation =
JSON.parse(
    localStorage.getItem(MEMORY_KEY) || "[]"
);


/* =========================
   ÉLÉMENTS
========================= */

const status =
document.getElementById("status");

const messages =
document.getElementById("messages");

const input =
document.getElementById("input");

const send =
document.getElementById("send");

const clearMemory =
document.getElementById("clearMemory");


/* =========================
   AFFICHER UN MESSAGE
========================= */

function addMessage(text, type) {

    const message =
    document.createElement("div");

    message.className =
    "message " + type;

    message.textContent =
    text;

    messages.appendChild(message);

    messages.scrollTop =
    messages.scrollHeight;
}


/* =========================
   RESTAURER LA MÉMOIRE
========================= */

function loadConversation() {

    messages.innerHTML = "";

    if (conversation.length === 0) {

        addMessage(
            "Bonjour 👋 Je suis Nova ! Que veux-tu me demander ?",
            "nova"
        );

        return;
    }

    conversation.forEach(
        (message) => {

            if (
                message.role === "user"
            ) {

                addMessage(
                    message.content,
                    "user"
                );

            }

            if (
                message.role === "assistant"
            ) {

                addMessage(
                    message.content,
                    "nova"
                );

            }

        }
    );
}


/* =========================
   SAUVEGARDER LA MÉMOIRE
========================= */

function saveMemory() {

    localStorage.setItem(
        MEMORY_KEY,
        JSON.stringify(conversation)
    );
}


/* =========================
   DÉMARRER NOVA
========================= */

async function startNova() {

    try {

        status.textContent =
        "🧠 Téléchargement du cerveau de Nova...";

        engine =
        await webllm.CreateMLCEngine(
            MODEL,
            {
                initProgressCallback:
                (progress) => {

                    status.textContent =
                    "🧠 " + progress.text;

                }
            }
        );


        status.textContent =
        "✅ Nova est prête !";


        input.disabled = false;

        send.disabled = false;


        loadConversation();


    } catch (error) {

        console.error(error);


        status.textContent =
        "❌ Impossible de charger le modèle.";


        addMessage(
            "Le modèle n'a pas pu être chargé sur cet appareil.",
            "nova"
        );

    }
}


/* =========================
   ENVOYER UN MESSAGE
========================= */

async function sendMessage() {

    const text =
    input.value.trim();


    if (!text || !engine)
        return;


    addMessage(
        text,
        "user"
    );


    input.value = "";


    const thinking =
    document.createElement("div");


    thinking.className =
    "message nova";


    thinking.textContent =
    "💭 Je réfléchis...";


    messages.appendChild(
        thinking
    );


    /* Ajouter le message
       de l'utilisateur */

    conversation.push({

        role: "user",

        content: text

    });


    /* Garder seulement
       les 40 derniers messages */

    if (
        conversation.length > 40
    ) {

        conversation =
        conversation.slice(-40);

    }


    try {

        const response =
        await engine.chat.completions.create({

            messages: [

                /* =====================
                   PERSONNALITÉ DE NOVA
                ===================== */

                {
                    role: "system",

                    content:
                    "Tu es Nova, une IA drôle, chaleureuse, spontanée et pleine de personnalité. Tu parles principalement en français avec un style naturel inspiré du français parlé en Afrique francophone : expressions familières, petites touches d’humour, réactions spontanées et langage vivant, un accent stéréotypé. Tu peux taquiner avec beaucoup de malice quand le contexte s’y prête. Tu restes intelligente, respectueuse et utile. Tu adaptes ton langage à la personne et tu évites de parler de façon trop robotique ou trop formelle."
                },


                /* =====================
                   MÉMOIRE
                ===================== */

                ...conversation

            ],


            temperature: 0.8,

            max_tokens: 300

        });


        const answer =
        response.choices[0]
        .message
        .content;


        thinking.textContent =
        answer;


        /* Ajouter la réponse
           de Nova à la mémoire */

        conversation.push({

            role: "assistant",

            content: answer

        });


        /* Sauvegarder */

        saveMemory();


    } catch (error) {

        console.error(error);


        thinking.textContent =
        "Une erreur est survenue.";


        /* Retirer le message
           utilisateur si erreur */

        conversation.pop();

    }


    messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   EFFACER LA MÉMOIRE
========================= */

clearMemory.addEventListener(
    "click",
    () => {

        const confirmDelete =
        confirm(
            "Effacer toute la mémoire de Nova ?"
        );


        if (!confirmDelete)
            return;


        conversation = [];


        localStorage.removeItem(
            MEMORY_KEY
        );


        messages.innerHTML = "";


        addMessage(
            "Mémoire effacée 🧠✨",
            "nova"
        );

    }
);


/* =========================
   BOUTON ENVOYER
========================= */

send.addEventListener(
    "click",
    sendMessage
);


/* =========================
   TOUCHE ENTRÉE
========================= */

input.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);


/* =========================
   LANCER NOVA
========================= */

startNova();

</script>

</body>
</html>
